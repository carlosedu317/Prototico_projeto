
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="cadastro.css">

    <title>Criar conta</title>
</head>

<body>

    <div class="cadastro-container">

        <!-- LADO ESQUERDO -->
        <div class="cadastro-left">

            <div class="decoracao">
                <span class="bolinha b1"></span>
                <span class="bolinha b2"></span>
                <span class="bolinha b3"></span>
                <span class="bolinha b4"></span>
                <span class="bolinha b5"></span>
            </div>

            <div class="logo-area">
                <img src="/imgs/Logo.png"
                     alt="Logo Doceria"
                     class="logo">
            </div>

            <h2 class="slogan">
                Doce começo,<br>
                cadastro fácil!
            </h2>

            <p class="subtexto">
                Crie sua conta e descubra nossas delícias
                feitas com muito carinho para você.
            </p>

        </div>


        <!-- LADO DIREITO -->
        <div class="cadastro-right">

            <div class="form-card">

                <h1 class="form-titulo">
                    Criar conta
                </h1>

                <p class="form-subtitulo">
                    Preencha seus dados para começar
                </p>


                <form id="cadastroForm">


                    <!-- NOME COMPLETO -->
                    <div class="campo-grupo">

                        <label for="nome" class="campo-label">
                            Nome completo
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icone">

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     width="18"
                                     height="18"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="2"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">

                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>

                                    <circle cx="12"
                                            cy="7"
                                            r="4"/>

                                </svg>

                            </span>


                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Seu nome completo"
                                required
                            >

                        </div>

                    </div>


                    <!-- TELEFONE -->
                    <div class="campo-grupo">

                        <label for="telefone" class="campo-label">
                            Telefone
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icone">

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     width="18"
                                     height="18"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="2"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">

                                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2
                                    19.79 19.79 0 0 1-8.63-3.07
                                    A19.5 19.5 0 0 1 4.15 12
                                    a19.79 19.79 0 0 1-3.07-8.67
                                    A2 2 0 0 1 3.06 1h3
                                    a2 2 0 0 1 2 1.72
                                    c.127.96.361 1.903.7 2.81
                                    a2 2 0 0 1-.45 2.11L7.09 8.91
                                    a16 16 0 0 0 6 6l1.27-1.27
                                    a2 2 0 0 1 2.11-.45
                                    c.907.339 1.85.573 2.81.7
                                    A2 2 0 0 1 21 16z"/>

                                </svg>

                            </span>


                            <input
                                type="tel"
                                id="telefone"
                                name="telefone"
                                placeholder="(00) 00000-0000"
                                maxlength="15"
                                required
                            >

                        </div>

                    </div>


                    <!-- E-MAIL -->
                    <div class="campo-grupo">

                        <label for="email" class="campo-label">
                            E-mail
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icone">

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     width="18"
                                     height="18"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="2"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">

                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12
                                    c0 1.1-.9 2-2 2H4
                                    c-1.1 0-2-.9-2-2V6
                                    c0-1.1.9-2 2-2z"/>

                                    <polyline points="22,6 12,13 2,6"/>

                                </svg>

                            </span>


                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="seu@email.com"
                                required
                            >

                        </div>

                    </div>


                    <!-- SENHA -->
                    <div class="campo-grupo">

                        <label for="senha" class="campo-label">
                            Senha
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icone">

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     width="18"
                                     height="18"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="2"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">

                                    <rect x="3"
                                          y="11"
                                          width="18"
                                          height="11"
                                          rx="2"
                                          ry="2"/>

                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>

                                </svg>

                            </span>


                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Mínimo 6 caracteres"
                                minlength="6"
                                required
                            >


                            <!-- ÍCONE DO OLHO -->
                            <span class="input-icone olho">

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     width="18"
                                     height="18"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="2">

                                    <path d="M1 12s4-8 11-8
                                    11 8 11 8-4 8-11 8
                                    -11-8-11-8z"/>

                                    <circle cx="12"
                                            cy="12"
                                            r="3"/>

                                </svg>

                            </span>

                        </div>

                    </div>


                    <!-- BOTÃO -->
                    <button
                        type="submit"
                        class="btn-cadastrar">

                        Criar minha conta

                    </button>


                </form>


                <!-- LOGIN -->
                <p class="link-login">

                    Já tem uma conta?

                    <a href="login.html"
                       class="link-rosa">

                        Entrar agora

                    </a>

                </p>

            </div>

        </div>

    </div>

</body>

</html>
