
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="login.css">

    <title>Login</title>
</head>

<body>

    <div class="containerLogin">

        <div class="img5">
            <a href="home.html">
                <img src="/imgs/voltar.png" alt="Voltar">
            </a>
        </div>


        <div class="cardLogin">

            <h2>Login</h2>

            <form id="loginForm">

                <input
                    type="email"
                    name="email"
                    placeholder="E-mail"
                    required
                >

                <input
                    type="password"
                    name="senha"
                    placeholder="Senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>


            <a href="cadastro.html" class="link">
                Criar conta
            </a>

        </div>

    </div>

</body>

</html>
